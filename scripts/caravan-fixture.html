const B=BABYLON,engine=new B.Engine(document.querySelector('canvas'),true),scene=new B.Scene(engine);scene.clearColor=B.Color4.FromHexString('#d5c6a5ff');const camera=new B.ArcRotateCamera('camera',-.97,1.12,15,new B.Vector3(33,1.1,30),scene);camera.attachControl(document.querySelector('canvas'),true);camera.lowerRadiusLimit=5;camera.upperRadiusLimit=35;camera.wheelPrecision=30;const light=new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene);light.intensity=1.5;const sun=new B.DirectionalLight('sun',new B.Vector3(-.4,-1,.6),scene);sun.intensity=2;const shadow=new B.ShadowGenerator(2048,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=24;

let previous=performance.now();engine.runRenderLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-previous)/1000);previous=now;if(!paused)time+=dt;c.phase=phase;if(phase!=='trading'&&!paused)c.x=6+(phase==='departing'?-1:1)*((time-start)*.22%1.5);view.update(state,c,time);for(const m of meshes)shadow.addShadowCaster(m);ground.position.y=surfaceElevation(c.x,c.y,state)-.025;camera.target.x=c.x*6+(phase==='departing'?3.7:-3.7);document.querySelector('#status').textContent=`${phase} · ${paused?'пауза':'движение'} · ${meshes.length} meshes`;scene.render();});window.addEventListener('resize',()=>engine.resize());
