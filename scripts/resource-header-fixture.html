<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Проверка ресурсной панели</title></head><body>
<div id="header-fixture"></div>
<aside id="fixture-controls" style="position:relative;margin:20px;padding:18px;border:1px solid #bfb197;background:#f4eddf;font:13px Arial;line-height:1.6;overflow:auto">
<label>Запасы <select id="fixture-stock"><option value="5000">5000 · как на снимке</option><option value="100000">100000 · крупные запасы</option><option value="0">0 · пустые запасы</option></select></label>
<button id="fixture-check">Проверить размещение</button>
<pre id="fixture-result" style="white-space:pre-wrap">Загрузка…</pre>
<small>Стенд использует настоящие HTML, CSS и шаблон ресурсов приложения. Сохранение города не читается и не меняется.</small>
</aside>
<script type="module">
import {RESOURCE_GROUPS} from '../season-balance.js';
import {RESOURCE_NAMES,MATERIALS} from '../definitions.js';
import {resourceIcon} from '../resource-icons.js';
const doc=new DOMParser().parseFromString(await (await fetch('../index.html')).text(),'text/html');
for(const link of doc.querySelectorAll('link[rel="stylesheet"]')){const copy=link.cloneNode();copy.href=new URL(link.getAttribute('href'),new URL('../',location.href));copy.href+='&fixture='+Date.now();document.head.append(copy);}
const fixture=document.querySelector('#header-fixture');fixture.append(doc.querySelector('.topbar'),doc.querySelector('.resourcebar'));
// Exercise the application's exact resource template without starting the game or touching localStorage.
const source=await (await fetch('../app.js')).text();
const template=source.split('\n').find(line=>line.includes("setHTML($('resources'),RESOURCE_GROUPS.map"));
if(!template)throw new Error('Resource template moved: update fixture extraction.');
const expression=template.trim().slice("setHTML($('resources'),".length,-2);
const render=new Function('RESOURCE_GROUPS','RESOURCE_NAMES','MATERIALS','resourceIcon','r','balance','rounded','label','storage','state','foodAmount','seedReserve',`return ${expression};`);
const output=document.querySelector('#fixture-result');
function paint(){const amount=Number(document.querySelector('#fixture-stock').value),r=Object.fromEntries(Object.keys(RESOURCE_NAMES).map(k=>[k,amount]));const deltas=[-1234.5,12.4,0,1234.5,-12.4,1.2,-.4],balance=Object.fromEntries(Object.keys(RESOURCE_NAMES).map((k,i)=>[k,{net:deltas[i%deltas.length],income:24,outgo:12}]));document.querySelector('#resources').innerHTML=render(RESOURCE_GROUPS,RESOURCE_NAMES,MATERIALS,resourceIcon,r,balance,Math.round,k=>RESOURCE_NAMES[k],()=>1000000,{resources:r},v=>v,()=>0);requestAnimationFrame(check);}
function check(){const errors=[],rect=e=>e.getBoundingClientRect(),overlap=(a,b)=>a.left<b.right-.5&&a.right>b.left+.5&&a.top<b.bottom-.5&&a.bottom>b.top+.5;const items=[...document.querySelectorAll('.resourcebar .resource')];for(const item of items){const bounds=rect(item),frame=rect(item.closest('.resource-frame')),parts=[item.querySelector('.resource-icon'),item.querySelector('strong'),item.querySelector('.season-delta'),item.querySelector('small')];if(bounds.width<=0||bounds.height<=0)errors.push('Resource hidden');for(const p of parts){const b=rect(p);if(b.left<bounds.left-.5||b.right>bounds.right+.5||b.top<bounds.top-.5||b.bottom>bounds.bottom+.5)errors.push(`${p.innerText||'icon'} outside its resource cell`);if(b.left<frame.left-.5||b.right>frame.right+.5||b.top<frame.top-.5||b.bottom>frame.bottom+.5)errors.push(`${item.innerText.replaceAll('\n',' ')} outside frame`);if(p.scrollWidth>p.clientWidth+1)errors.push(`${p.innerText} clipped`);}for(let a=0;a<parts.length;a++)for(let b=a+1;b<parts.length;b++)if(overlap(rect(parts[a]),rect(parts[b])))errors.push(`${parts[a].innerText||'icon'} overlaps ${parts[b].innerText}`);if(bounds.right>innerWidth+.5)errors.push('Resource outside viewport');const size=parseFloat(getComputedStyle(item.querySelector('small')).fontSize);if(size<8)errors.push(`Label font ${size}px`);}for(let a=0;a<items.length;a++)for(let b=a+1;b<items.length;b++)if(overlap(rect(items[a]),rect(items[b])))errors.push('Resource cells overlap');const rowCount=selector=>new Set([...document.querySelectorAll(selector+' .resource')].map(e=>Math.round(rect(e).top))).size;const report={width:innerWidth,stock:Number(document.querySelector('#fixture-stock').value),resources:items.length,basicRows:rowCount('.resource-frame-basic'),processedRows:rowCount('.resource-frame-processed'),resourcebarHeight:Math.round(rect(document.querySelector('.resourcebar')).height),horizontalOverflow:document.documentElement.scrollWidth>innerWidth,errors:[...new Set(errors)]};if(report.basicRows!==(innerWidth>=1500?1:2))errors.push('Unexpected добыча row count');if(report.processedRows!==(innerWidth<=480?3:2))errors.push('Unexpected переработка row count');const citizens=rect(document.querySelector('.citizens'));for(const frame of document.querySelectorAll('.resource-frame'))if(overlap(citizens,rect(frame)))errors.push('Citizens overlap resource frame');report.errors=[...new Set(errors)];output.textContent=JSON.stringify(report,null,2);output.dataset.passed=String(!errors.length&&!report.horizontalOverflow&&items.length===15);}
document.querySelector('#fixture-stock').onchange=paint;document.querySelector('#fixture-check').onclick=check;addEventListener('resize',()=>requestAnimationFrame(check));await Promise.all([...document.querySelectorAll('link[rel="stylesheet"]')].map(link=>link.sheet?Promise.resolve():new Promise(resolve=>{link.onload=resolve;link.onerror=resolve;})));paint();
</script></body></html>
