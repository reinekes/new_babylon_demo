<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runtime texture verification</title><style>body{margin:0;background:#cbbd9d;color:#263d37;font:14px Arial}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;left:16px;top:16px;max-width:560px;padding:12px;background:#f5eddbef;border:1px solid #bda77f;border-radius:5px}button{padding:8px 12px;margin:4px;cursor:pointer}#status{font-size:12px;line-height:1.6}small{display:block;margin-top:5px}</style><canvas id="view"></canvas><nav><b>Проверка текстур · настоящие модели игры</b><div><button data-model="goat-downloaded">Коза</button><button data-model="caravan-camel">Верблюд</button><button data-model="ambient-bull">Бык</button><button data-model="ambient-donkey">Осёл</button><button id="motion">Движение</button></div><div id="status">Загрузка…</div><small>Стенд не запускает игру и не читает сохранение. Геометрия, шкуры, мех и анимации загружены из runtime GLB.</small></nav><script src="../assets/vendor/babylon-9.31.0.js"></script><script src="../assets/vendor/babylonjs-loaders-9.31.0.min.js"></script><script>
const B=BABYLON,engine=new B.Engine(document.querySelector('canvas'),true),scene=new B.Scene(engine);scene.clearColor=B.Color4.FromHexString('#cbbd9dff');const camera=new B.ArcRotateCamera('camera',-.9,1.16,5,new B.Vector3(0,.7,0),scene);camera.attachControl(document.querySelector('canvas'),true);camera.lowerRadiusLimit=1;camera.upperRadiusLimit=12;camera.wheelPrecision=60;const sky=new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene);sky.intensity=1.1;const sun=new B.DirectionalLight('sun',new B.Vector3(-.5,-1,.3),scene);sun.intensity=1.6;const ground=B.MeshBuilder.CreateGround('ground',{width:40,height:40},scene);const mat=new B.StandardMaterial('earth',scene);mat.diffuseColor=B.Color3.FromHexString('#b9aa8b');ground.material=mat;let current=null,moving=false;const models={};const status=document.querySelector('#status');
async function show(name){if(current===name)return;status.textContent='Загрузка '+name+'…';for(const c of Object.values(models))for(const m of c.meshes)m.setEnabled(false);let container=models[name];if(!container){container=await B.SceneLoader.LoadAssetContainerAsync('../assets/art-courtyard/models/',name+'.glb?texture-check='+Date.now(),scene,undefined,'.glb');container.addAllToScene();models[name]=container;for(const group of container.animationGroups)group.stop();const preview=container.animationGroups.find(g=>/idle/i.test(g.name))||container.animationGroups[0];if(preview){preview.start(false,1,0,1);preview.goToFrame(0);preview.pause();}}for(const m of container.meshes)m.setEnabled(true);scene.render();for(const skeleton of container.skeletons)skeleton.prepare();for(const m of container.meshes){m.computeWorldMatrix(true);if(m.getTotalVertices()>0)m.refreshBoundingInfo(true);}const meshes=container.meshes.filter(m=>m.getTotalVertices()>0);let min=new B.Vector3(Infinity,Infinity,Infinity),max=new B.Vector3(-Infinity,-Infinity,-Infinity);for(const m of meshes){const box=m.getBoundingInfo().boundingBox;min=B.Vector3.Minimize(min,box.minimumWorld);max=B.Vector3.Maximize(max,box.maximumWorld);}camera.target=B.Vector3.Center(min,max);camera.radius=Math.max(max.x-min.x,max.y-min.y,max.z-min.z)*2.25;ground.position.y=min.y-.025;current=name;moving=false;status.textContent=name+' · '+meshes.length+' meshes · '+container.skeletons.length+' skins · '+container.animationGroups.length+' clips · '+container.textures.length+' textures · размер '+(max.x-min.x).toFixed(2)+'×'+(max.y-min.y).toFixed(2)+'×'+(max.z-min.z).toFixed(2);document.querySelector('#motion').textContent='Движение';}
document.querySelectorAll('[data-model]').forEach(button=>button.onclick=()=>show(button.dataset.model));document.querySelector('#motion').onclick=()=>{moving=!moving;const container=models[current],group=container.animationGroups.find(g=>/walk|idle/i.test(g.name))||container.animationGroups[0];if(group){if(moving)group.start(true);else group.pause();}document.querySelector('#motion').textContent=moving?'Пауза':'Движение';};engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());show('goat-downloaded');
</script></html>
