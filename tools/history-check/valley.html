<!doctype html><html lang="ru"><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сады и небо · приёмка</title><link rel="stylesheet" href="game3d/style.css"><style>html,body{height:100%;margin:0;background:#211e18;color:#eee0bd;font:14px system-ui}body{display:flex;flex-direction:column}nav{padding:8px}button,select{background:#3a3024;color:inherit;border:1px solid #988157;padding:6px;margin:2px}output{display:block;white-space:pre-wrap}pre{max-height:150px;overflow:auto}.world{position:relative;flex:1;min-height:0}#city{width:100%;height:100%;display:block}.game3d-metrics{display:none}#flat{position:absolute;right:12px;bottom:12px;width:240px;height:200px;background:#d4c39f}</style><nav>Сады и долина · изолированная визуальная проверка. Готовый сад задан стендом, часы меняют свет; строительство и урожай здесь не проверяются.<br><label>Seed <select id="seed"><option>137</option><option>42</option><option>29</option></select></label><label>Вид <select id="view"><option value="garden">Сад</option><option value="bank-a">Первый берег</option><option value="bank-b">Другой берег</option><option value="horizon">Низко вдоль реки</option></select></label><label>Час <select id="hour"><option>12</option><option>6</option><option>18</option><option>0</option></select></label><label>Поворот сада <select id="rotation"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><button id="capture" disabled>Снять показания</button><output id="status">Загрузка</output><details><summary>Протокол</summary><pre id="proof"></pre></details></nav><div class="world"><canvas id="city"></canvas><canvas id="flat" width="480" height="400"></canvas></div><script type="module" src="tools/history-check/valley.js"></script></html>
