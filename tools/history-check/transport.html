<!doctype html><html lang="ru"><meta charset="utf-8"><base href="../../"><title>Sumer transport QA</title><style>body{margin:0;background:#27231c;color:#eee0bd;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}nav{position:absolute;bottom:12px;left:12px;background:#211f19eb;padding:12px;border:1px solid #99845d}select,button{padding:8px;background:#393024;color:#eee0bd;border:1px solid #99845d;margin:4px}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere}body{display:flex;flex-direction:column;height:100vh}canvas{order:2;flex:1;min-height:0;width:100%;height:auto}nav{order:1;position:static;margin:8px;padding:10px;max-width:none}nav p{margin:6px 0}output{margin:6px 0}details pre{max-height:180px;overflow:auto}</style><canvas></canvas><nav><label>История <select id="history"><option value="strict">Южный Шумер</option><option value="legacy">Прежняя</option></select></label><label>Транспорт <select id="transport"><option value="land">Караван</option><option value="river">Лодка</option></select></label><label>Груз <select id="stock"><option value="default">Исходный</option><option value="all">Все15видов</option><option value="empty">Пусто</option><option value="stone">Только камень</option></select></label><button id="move">Движение</button><button id="capture">Снять показания</button><p>Игровые модели обеих ветвей; число животных и вместимость условны.<br>Изолированный стенд без сохранений; симуляцию торговли проверяют отдельно.</p><output>Загрузка</output><details><summary>Протокол</summary><pre id="proof"></pre></details></nav><script>window.addEventListener('error',event=>{document.querySelector('output').textContent='Ошибка: '+event.message;});window.addEventListener('unhandledrejection',event=>{document.querySelector('output').textContent='Ошибка: '+String(event.reason);});</script><script type="module">
import {loadBabylonVendors} from './game3d/vendor-loading.js';
import {createTradeCaravan} from './game3d/caravan.js';import {createTradeRiverCraft} from './game3d/river-craft.js';import {createDistrictMaterials} from './district3d/materials.js';import {GOODS_KINDS,createGoodsSources} from './game3d/goods.js';import {strictScenario,legacyScenario} from './scenario-profiles.js';import {WATER_HEIGHT} from './game3d/water.js';import {surfaceElevation} from './district3d/terrain.js';
const B=await loadBabylonVendors(),engine=new B.Engine(document.querySelector('canvas'),true),scene=new B.Scene(engine);scene.clearColor=B.Color4.FromHexString('#c6b99fff');scene.imageProcessingConfiguration.toneMappingEnabled=true;scene.imageProcessingConfiguration.toneMappingType=B.ImageProcessingConfiguration.TONEMAPPING_ACES;scene.imageProcessingConfiguration.exposure=1.1;const hdr=new B.HDRCubeTexture('assets/art-courtyard/textures/kiara_1_dawn_1k.hdr',scene,128,false,true,false,true);hdr.onLoadObservable.addOnce(()=>scene.environmentTexture=hdr);
const camera=new B.ArcRotateCamera('qa',.7,1.2,18,new B.Vector3(32,1,30),scene);camera.attachControl(document.querySelector('canvas'),true);camera.minZ=.1;new B.HemisphericLight('ambient',new B.Vector3(0,1,0),scene).intensity=.8;new B.DirectionalLight('sun',new B.Vector3(-.7,-1,.4),scene).intensity=2;
const materials=createDistrictMaterials(B,scene),goods=createGoodsSources(B,scene,materials),meshes=[],water=new B.PBRMaterial('qa-water',scene);water.albedoColor=B.Color3.FromHexString('#688f8b').toLinearSpace();water.roughness=.6;const ground=B.MeshBuilder.CreateGround('ground',{width:100,height:100},scene);ground.position.set(30,0,30);ground.material=materials.soil;
let state={scenario:strictScenario(),buildings:[],world:{lakes:[]},simTime:0},caravan={id:'same-visit',x:6,y:5,phase:'arriving',route:[{x:3,y:5},{x:7,y:5}],routeIndex:1,stock:{food:30,wood:80,pottery:40,reed:50}},time=0,moving=false,pureUpdates=true;
const land=await createTradeCaravan(B,scene,meshes,materials,goods,{initialState:state}),river=createTradeRiverCraft(B,scene,meshes,materials,goods);
function cargoProof(){const cargo=meshes.filter(m=>m.metadata?.riverCargo);return {stock:{...caravan.stock},kinds:cargo.map(m=>m.metadata.goods.kind),meshes:cargo.map(m=>({name:m.name,goods:m.metadata.goods,enabled:m.isEnabled(),visible:m.isVisible,position:m.position.asArray()})),stockSignature:river.root?.metadata?.stockSignature};}
async function sync(){state.scenario=document.querySelector('#history').value==='strict'?strictScenario():legacyScenario();const before=JSON.stringify(caravan),boat=document.querySelector('#transport').value==='river';land.update(state,boat?null:caravan,time);await land.ready;land.update(state,boat?null:caravan,time);river.update(state,boat?{...caravan,transport:'river'}:null,time);if(river.ready)await river.ready;river.update(state,boat?{...caravan,transport:'river'}:null,time);ground.material=boat?water:materials.soil;ground.position.y=boat?WATER_HEIGHT:surfaceElevation(caravan.x,caravan.y,state)-.04;camera.setTarget(new B.Vector3(boat?36:32,boat?.1:1,30));camera.alpha=.7;camera.beta=1.2;camera.radius=boat?12:15;document.querySelector('output').textContent=(boat?JSON.stringify(river.root?.metadata):land.actors.map(a=>a.kind).join(' · '))+(boat?'\nВиды на палубе: '+cargoProof().kinds.join(', '):'')+'\nТолько проверка вида; количества остаются в stock';document.querySelector('#proof').textContent=JSON.stringify({profile:state.scenario.history,transport:boat?'river':'land',pure:before===JSON.stringify(caravan),caravan,actors:land.actors.map(a=>({kind:a.kind})),boat:river.root?.metadata,cargo:cargoProof()},null,2);}
for(const el of document.querySelectorAll('select'))el.onchange=sync;document.querySelector('#stock').onchange=async()=>{const kind=document.querySelector('#stock').value;caravan.stock=kind==='all'?Object.fromEntries(GOODS_KINDS.map(k=>[k,50])):kind==='empty'?{}:kind==='stone'?{stone:3}:{food:30,wood:80,pottery:40,reed:50};await sync();};document.querySelector('#capture').onclick=()=>{document.querySelector('#proof').textContent=JSON.stringify({profile:state.scenario.history,transport:document.querySelector('#transport').value,time,moving,pureUpdates,caravan:structuredClone(caravan),actors:land.actors.map(a=>({kind:a.kind,phase:a.phase,clip:a.clip,position:a.root.position.asArray(),rotation:a.root.rotation.asArray()})),boat:river.root?.metadata,cargo:cargoProof()},null,2);};document.querySelector('#move').onclick=()=>{moving=!moving;document.querySelector('#move').textContent=moving?'Пауза':'Движение';};await sync();let last=performance.now();engine.runRenderLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(moving){time+=dt;caravan.x+=dt*.04;if(caravan.x>6.3)caravan.x=6;}const before=JSON.stringify({state,caravan}),boat=document.querySelector('#transport').value==='river';land.update(state,boat?null:caravan,time);river.update(state,boat?{...caravan,transport:'river'}:null,time);pureUpdates=pureUpdates&&before===JSON.stringify({state,caravan});scene.render();});window.onresize=()=>engine.resize();
</script></html>
