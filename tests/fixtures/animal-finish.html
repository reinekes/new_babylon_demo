<!doctype html><html lang="ru"><meta charset="utf-8"><title>Короткая шерсть кошки</title><base href="../../"><link rel="stylesheet" href="game3d/style.css"><style>html,body{margin:0;height:100%;background:#d3c6a5}.world{height:100%;position:relative}canvas{width:100%;height:100%;display:block}.tools{position:absolute;z-index:3;top:12px;left:12px;max-width:350px;background:#eee2c6;color:#352e23;padding:12px;border-radius:8px;font:14px sans-serif}.tools button,.tools select{margin:5px 2px}.tools small{display:block;line-height:1.45}</style><div class="world"><aside class="tools"><b>Шерсть является частью поверхности</b><div><button id="cat">Кошка</button><button id="goat">Коза</button><button id="back">Другая сторона</button><button id="above">Сверху / сбоку</button></div><select id="animal"></select><small>Настоящие животные игры, кошки вызваны через bringCat. Полосы кошки — цвет её короткой шерсти, без отдельных накладок. Сцена остановлена и ничего не сохраняет.</small></aside><canvas id="city"></canvas></div><script src="assets/vendor/babylon-9.31.0.js"></script><script src="assets/vendor/babylonjs-loaders-9.31.0.min.js"></script><script type="module">
import {createGame} from './engine.js';import {createGameRenderer} from './game3d/renderer.js';import {bringCat} from './pests.js';import {animalsFor} from './fauna.js';import {coatVariant} from './game3d/animal-coats.js';
const state=createGame();for(const [x,y]of [[4,4],[6,4]])state.buildings.push({type:'granary',x,y,level:1});while(bringCat(state)){}
const renderer=await createGameRenderer(document.querySelector('canvas'),()=>{},{initialState:state});renderer.lightMode='day';renderer.camera.lowerRadiusLimit=1.6;renderer.camera.upperRadiusLimit=80;
const selector=document.querySelector('#animal'),animals=animalsFor(state).filter(c=>['cat','goat'].includes(c.kind));for(const a of animals){const option=document.createElement('option');option.value=a.id;option.textContent=`${a.kind==='cat'?'Кошка':'Коза'} · ${a.id} · окрас ${coatVariant(a.id)+1}`;selector.append(option);}
function focus(reset=true){const a=animalsFor(state).find(c=>c.id===selector.value);if(!a)return;renderer.camera.setTarget(new BABYLON.Vector3(a.x*6,a.kind==='cat'?.24:.65,a.y*6));renderer.camera.radius=a.kind==='cat'?2.7:4.5;if(reset){renderer.camera.alpha=1.9;renderer.camera.beta=1.04;}}
selector.onchange=()=>focus();for(const kind of ['cat','goat'])document.querySelector('#'+kind).onclick=()=>{selector.value=animals.find(a=>a.kind===kind).id;focus();};document.querySelector('#back').onclick=()=>renderer.camera.alpha+=Math.PI;document.querySelector('#above').onclick=()=>renderer.camera.beta=renderer.camera.beta<.6?1.04:.32;
selector.value=animals.find(a=>a.kind==='cat').id;focus();globalThis.animalFinish={state,renderer,animals};function frame(now){renderer.draw(state,null,now,{paused:true,speed:1});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
