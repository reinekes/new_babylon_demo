<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>Компактный город · проверка 390 / 768 / 1440</title><style>html,body{margin:0;background:#d9ddcf;font:12px Arial;color:#344538}header{padding:12px;position:sticky;top:0;background:#ebe8da;z-index:2}h1{font:20px Georgia;margin:0 0 8px}#results{font:11px ui-monospace,monospace;white-space:pre-wrap;margin:8px 0}#frames{display:flex;gap:16px;align-items:start;padding:12px;width:max-content}iframe{height:850px;border:1px solid #b5bea4;background:#f5f0df}label{display:inline-flex;gap:8px;align-items:center}select{padding:5px}</style></head><body><header><h1>Компактные обзоры · изолированная проверка</h1><label>Показать <select id="view"><option value="citizens">Жители</option><option value="workshops">Работа</option><option value="districts">Кварталы</option><option value="overview">Жизнь: обзор</option><option value="wellbeing">Самочувствие</option><option value="work">Труд</option><option value="faith">Вера</option><option value="residents">Летопись жителей</option><option value="family">Родословная</option><option value="history">История</option></select></label><output id="results">Проверка макетов…</output></header><div id="frames"></div><script>
const results=new Map();
for(const width of [390,768,1440]){const frame=document.createElement('iframe');frame.width=width;frame.src='tests/fixtures/compact-city-analytics-frame.html?width='+width;frame.title='Макет '+width+' px';document.querySelector('#frames').append(frame);}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.kind!=='compact-city-results')return;results.set(event.data.width,event.data);document.querySelector('#results').textContent=[...results.values()].sort((a,b)=>a.width-b.width).map(r=>JSON.stringify(r)).join('\n');});
document.querySelector('#view').addEventListener('change',event=>{for(const frame of document.querySelectorAll('iframe'))frame.contentWindow.postMessage({kind:'compact-city-view',view:event.target.value},location.origin);});
</script></body></html>
