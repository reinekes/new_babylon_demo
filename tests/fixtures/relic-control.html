function step(seconds){for(let t=0;t<seconds-1e-8;t+=.1){if(!advanceTime(state,Math.min(.1,seconds-t)))break;}refresh();}
function draw(now){renderer.draw(state,null,now,{paused,speed:1});if(renderer.mode!=='3d')drawRelic2D(renderer,state);}
$('play').onclick=()=>{paused=!paused;refresh();};$('step-one').onclick=()=>step(1);$('step-five').onclick=()=>step(5);
$('arrive').onclick=()=>{paused=true;for(let i=0;i<1600;i++){const c=selected();if(!c||c.routeIndex>=c.route.length)break;if(!advanceTime(state,.1))break;}status('Маршрут пройден настоящими шагами симуляции.');refresh();};
$('wait-party').onclick=()=>{paused=true;const phase=quest().phase;for(let i=0;i<310&&quest().phase===phase;i++)if(!advanceTime(state,.1))break;status('Ожидание завершено через симуляцию.');refresh();};
$('focus-oasis').onclick=()=>{const p=view().searchPoint;renderer.focusOn(p.x,p.y);draw(performance.now());refresh();};$('focus-person').onclick=()=>{const c=selected()||state.citizens[0];renderer.focusOn(c.x,c.y);draw(performance.now());refresh();};
$('reload-memory').onclick=()=>{const before={id:quest().actorId,faith:state.resources.faith,people:JSON.stringify(state.citizens.map(c=>({id:c.id,home:c.home,parents:c.parents,cargo:c.cargo,buildCargo:c.buildCargo,x:c.x,y:c.y})))};const next=decode(encode(state));if(!next){status('ОШИБКА: состояние не загрузилось');return;}state=next;reloadChecks={actorUnchanged:before.id===quest().actorId,faithUnchanged:before.faith===state.resources.faith,peopleAndFreightUnchanged:before.people===JSON.stringify(state.citizens.map(c=>({id:c.id,home:c.home,parents:c.parents,cargo:c.cargo,buildCargo:c.buildCargo,x:c.x,y:c.y})))};status('Город загружен из строки в памяти. Игровое сохранение не затронуто.');refresh();};
$('guard-city').onclick=()=>{const id=selected().id,before=state.resources.faith;guards={build:build(state,'house',2,2),miracle:miracle(state,'rain'),role:setCitizenRole(state,id,'carrier'),faithUnchanged:state.resources.faith===before};status('Проверены реальные команды строительства, чуда и смены роли.');refresh();};
$('reset').onclick=()=>{state=prepare();paused=true;guards=null;reloadChecks=null;renderer.resetPresentation?.();renderer.home();$('start-card').innerHTML=relicStartHTML(state,state.citizens[0],{id:questId});status('Новый изолированный город · 250 веры · готовое святилище · избранный №0');refresh();};
$('start-card').innerHTML=relicStartHTML(state,state.citizens[0],{id:questId});renderer.focusOn(state.citizens[0].x,state.citizens[0].y);status('Карта готова. Начни поиск; затем покажи оазис и нажми прямо на отмеченный знак.');draw(performance.now());refresh();
// Repeatable integration scenario uses the same commands and real time steps;
// it is separate from manual mouse QA and never touches browser storage.
function qaScenario(){
 const mode=new URLSearchParams(location.search).get('qa');if(!['carry','complete','swim','effects'].includes(mode))return;
 const check=(name,ok)=>{scenarioChecks.push({name,ok:!!ok});if(!ok)throw Error('QA: '+name);};
 const roundtrip=()=>{const id=quest().actorId,faith=state.resources.faith,people=state.citizens.map(c=>[c.id,c.home,c.x,c.y,c.cargo,c.buildCargo]);const next=decode(encode(state));check('save-roundtrip-'+quest().phase,!!next&&next[questId==='land'?'landRelicQuest':'relicQuest'].actorId===id&&next.resources.faith===faith&&JSON.stringify(next.citizens.map(c=>[c.id,c.home,c.x,c.y,c.cargo,c.buildCargo]))===JSON.stringify(people));state=next;};
 const arrive=()=>{for(let i=0;i<1600&&selected()?.routeIndex<selected()?.route.length;i++)advanceTime(state,.1);};
 check('start-cost-250',controls.start(0,questId).ok&&state.resources.faith===0);controls.move(shoreTile());step(1);roundtrip();arrive();check('route-to-relic-real',view().canSearch);if(mode==='swim'){check('swimming-actual-oasis',view().swimming);const c=selected();renderer.focusOn(c.x,c.y);if(renderer.camera)renderer.camera.radius=7;renderer.lightMode='day';status('Проверка плавания: реальный путь в оазис пройден, голова над водой; пауза сохраняет позу.');draw(performance.now());refresh();return;}check('search',searchRelic(state).ok);step(1);roundtrip();step(2);for(let i=0;i<160&&!quest().rejoicingReady;i++)advanceTime(state,.1);check('real-guests',quest().celebrants.length>0);for(let i=0;i<310&&quest().phase==='rejoicing';i++)advanceTime(state,.1);check('carried-unique-token',quest().phase==='carrying'&&visibleCitizens(state).find(c=>c.id===0)?.relic&&Object.keys(selected().cargo).length===0);roundtrip();
 if(mode==='complete'||mode==='effects'){check('temple-command',controls.deliver('9,8').ok);step(1);roundtrip();arrive();check('temple-celebration',quest().phase==='celebrating');if(mode==='effects')draw(performance.now());for(let i=0;i<310&&quest().phase==='celebrating';i++)advanceTime(state,.1);check('completed-name',quest().phase==='completed'&&state.name===view().divineName);if(mode==='complete')roundtrip();check('city-unlocked',!relicControlActive(state));renderer.focusOn(9,8);if(mode==='effects'&&renderer.camera)renderer.camera.radius=22;}else{const c=selected();renderer.focusOn(c.x,c.y);if(renderer.camera)renderer.camera.radius=10;}
 check('final-state-valid',validateRelicQuest(state));renderer.lightMode='day';status('Автоматический сценарий пройден: '+scenarioChecks.length+' проверок. Тестовый дневной свет; ручное управление проверяется отдельно.');draw(performance.now());refresh();
}
try{qaScenario();}catch(error){status(error.message);refresh();}
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused)advanceTime(state,dt);draw(now);if(now-lastRefresh>250){lastRefresh=now;refresh();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
