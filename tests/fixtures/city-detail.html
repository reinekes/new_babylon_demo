<!doctype html><html lang="ru"><meta charset="utf-8"><title>City detail · isolated renderer verification</title><base href="../../"><link rel="stylesheet" href="game3d/style.css"><style>html,body{margin:0;height:100%;background:#303c2a}.world{position:relative;height:100%}canvas{display:block;width:100%;height:100%}.qa{position:absolute;bottom:12px;left:12px;z-index:30;background:#efe4c9e8;padding:8px;font:12px Arial}.qa button{padding:7px;margin:2px}</style><div class="world"><canvas id="city"></canvas><div class="qa"><button data-view="people">Жители</button><button data-view="goat">Коза</button><button data-view="stocks">Запасы</button><button id="preview-pause">Продолжить</button><button data-speed="1">1×</button><button data-speed="4">4×</button><output id="status">Изолированная проверка рендера · сохранения не используются</output></div></div><script src="assets/vendor/babylon-9.31.0.js"></script><script src="assets/vendor/babylonjs-loaders-9.31.0.min.js"></script><script type="module">
import {createGameRenderer} from './game3d/renderer.js';import {createGame} from './engine.js';import {grantTestResources} from './test-tools.js';import {animalsFor} from './fauna.js';import {groundStocks} from './game3d/landscape.js';import {networkFor} from './workforce.js';
const state=createGame();grantTestResources(state);let paused=true,speed=1,travel=0,last=performance.now();const origin=state.citizens.map((c,i)=>({x:5.5+(i%4)*.45,y:11+Math.floor(i/4)*.5}));
for(const [i,c]of state.citizens.entries()){c.phase='toStore';c.work='7,7';c.cargo=i%4===0?{clay:2}:{};c.x=origin[i].x;c.y=origin[i].y;}
state.simTime=1;const renderer=await createGameRenderer(document.querySelector('canvas'),()=>{},{initialState:state});
function focus(kind){let p={x:6.2,y:11.5};if(kind==='goat')p=animalsFor(state).find(a=>a.kind==='goat');if(kind==='stocks')p=groundStocks(state,networkFor(state));renderer.camera.setTarget(new BABYLON.Vector3(p.x*6,.8,p.y*6));renderer.camera.radius=kind==='people'?12:kind==='goat'?5:8;renderer.camera.beta=.98;}
for(const el of document.querySelectorAll('[data-view]'))el.onclick=()=>focus(el.dataset.view);for(const el of document.querySelectorAll('[data-speed]'))el.onclick=()=>{speed=Number(el.dataset.speed);};document.querySelector('#preview-pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Продолжить':'Пауза';};focus('people');
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused){travel+=dt*speed*.25;state.simTime+=dt*speed*.25;for(const [i,c]of state.citizens.entries())c.x=origin[i].x+(travel*1.05)%2;}renderer.draw(state,null,now,{paused,speed});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
