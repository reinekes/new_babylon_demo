<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../encyclopedia.css"><style>body{font:14px system-ui;background:#f2eee3;padding:18px;color:#344538}button{padding:9px;margin:4px}#root{max-width:1080px}pre{white-space:pre-wrap;font-size:11px}#results{border:1px solid #b8ae8b;padding:10px}</style><title>Музыка — проверка библиотеки</title><button id="sound">Звук города</button><button id="open">Энциклопедия</button><button id="close">Закрыть энциклопедию</button><button id="funeral">Процессия</button><button id="return">Возвращение после похорон</button><button id="extinction">Гибель поселения</button><button id="check">Проверить 10 MP3</button><pre id="metrics"></pre><pre id="results">Проверка файлов ещё не запускалась</pre><div id="root"></div><script type="module">
import {createCityAudio} from '../../city-audio.js';import {renderSongEncyclopedia} from '../../ui-encyclopedia.js';import {MUSIC_TRACKS,musicTrackURL} from '../../music-tracks.js';
const root=document.querySelector('#root'),state={simTime:0,citizens:[{id:1}],buildings:[]},elements=[],results=[],errors=[];let ctl=null,preview=false;
const audio=createCityAudio(message=>errors.push(message),{createMedia(){const el=new Audio();elements.push(el);return el;}});
document.querySelector('#sound').onclick=()=>audio.toggle();document.querySelector('#open').onclick=async()=>{ctl?.destroy();ctl=await renderSongEncyclopedia(root,{selectedId:'city-lament',onPreviewChange(value){preview=value;audio.setPreviewing(value);}});};
document.querySelector('#close').onclick=()=>{ctl?.destroy();ctl=null;root.innerHTML='';};document.querySelector('#funeral').onclick=()=>{state.lost=false;state.funeral={stage:'procession',deceased:[{id:2}]};};document.querySelector('#return').onclick=()=>{state.funeral={...state.funeral,stage:'returning'};};document.querySelector('#extinction').onclick=()=>{state.lost=true;state.funeral=null;state.citizens=[];};
document.querySelector('#check').onclick=async()=>{
 if(!ctl)return;const select=root.querySelector('select'),el=root.querySelector('audio');for(const track of MUSIC_TRACKS){select.value=track.id;select.dispatchEvent(new Event('change',{bubbles:true}));const record={id:track.id,file:track.file};try{await el.play();await new Promise(resolve=>setTimeout(resolve,100));record.duration=el.duration;record.time=el.currentTime;record.error=el.error?.code||null;record.ok=!el.paused&&el.readyState>=2&&Number.isFinite(el.duration)&&el.currentTime>0;el.pause();}catch(e){record.ok=false;record.error=e.message;}results.push(record);document.querySelector('#results').textContent=JSON.stringify(results,null,2);}select.value='extinction';select.dispatchEvent(new Event('change',{bubbles:true}));};
function frame(){audio.tick(state,false);const el=root.querySelector('audio');document.querySelector('#metrics').textContent=JSON.stringify({city:audio.status,actualGamePlaying:elements.filter(el=>!el.paused).map(el=>decodeURIComponent(el.src.split('/').at(-1))),preview,previewPaused:el?.paused??true,previewTime:el?.currentTime||0,errors,overflow:document.documentElement.scrollWidth>innerWidth},null,2);requestAnimationFrame(frame);}frame();window.addEventListener('pagehide',()=>{ctl?.destroy();audio.dispose();});
</script></html>
