<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Музыка без обрыва — проверка</title>
<style>body{font:16px system-ui;background:#f2eedf;color:#293f37;max-width:1050px;margin:auto;padding:24px}button{background:#e4ead9;border:1px solid #7d9272;border-radius:5px;padding:10px;margin:4px;color:inherit}pre{white-space:pre-wrap;background:#fff9;border:1px solid #b4b39d;padding:15px;font:13px monospace}dialog{max-width:450px;background:#faf4e3;color:inherit;border:1px solid #a5a087;border-radius:8px}dialog::backdrop{background:#23372b55}</style>
<h1>Непрерывная музыка и близкий литофон</h1><p>Настоящие MP3 и аудиоконтроллер игры, HTML-модалка и событие игрового движка. Сохранения не создаются.</p><button id="run">Запустить проверку</button><button id="mute">Выключить звук</button><p id="message" role="status">Звук ещё не разрешён</p><pre id="checks"></pre><pre id="metrics"></pre><dialog id="window"><h2 id="title"></h2><p id="text"></p><button id="close">Закрыть</button></dialog>
<script type="importmap">{"imports":{"../../city-audio.js":"../../city-audio.js?v=audio-continuity-20261027-1","../../music-audio.js":"../../music-audio.js?v=audio-continuity-20261027-1"}}</script>
<script type="module">
import {createCityAudio} from '../../city-audio.js';
import {cityAudioListener} from '../../music-audio.js';
import {createGame,advanceSeason,resolveEvent} from '../../engine.js';
const s=createGame({start:'established'}),tracks=[],checks=[],dialog=document.querySelector('#window');let paused=false,running=false,renderer={camera:{target:{x:30,z:30},radius:41.6}};
const audio=createCityAudio(text=>document.querySelector('#message').textContent=text,{createMedia(){const el=new Audio();el.dataset.plays='0';el.addEventListener('play',()=>el.dataset.plays=String(Number(el.dataset.plays)+1));tracks.push(el);return el;}});
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function ready(){const limit=performance.now()+10000;while(performance.now()<limit){const el=current();if(el&&!el.paused&&el.readyState>=3&&el.currentTime>.1)return true;await wait(50);}return false;}
const check=(name,pass,detail)=>checks.push({name,pass:!!pass,...(detail===undefined?{}:{detail})});
const current=()=>tracks.find(el=>el.src.includes('main-theme'));
function open(title,text){document.querySelector('#title').textContent=title;document.querySelector('#text').textContent=text;dialog.showModal();}
document.querySelector('#close').onclick=()=>dialog.close();
document.querySelector('#run').onclick=async event=>{if(running)return;running=true;event.target.disabled=true;checks.length=0;try{
 check('До opt-in нет MP3',performance.getEntriesByType('resource').every(r=>!r.name.includes('/assets/audio/')));audio.tick(s,false,cityAudioListener(renderer));await audio.toggle();await ready();
 const background=current();check('Фон декодирован и играет',background&&!background.paused&&background.currentTime>0&&background.readyState>=3);let before=background.currentTime,plays=background.dataset.plays;
 open('Энциклопедия','Обычное окно не останавливает музыку.');await wait(750);check('HTML-модалка не прерывает фон',dialog.open&&!background.paused&&background.currentTime>before+.3&&background.dataset.plays===plays);dialog.close();
 for(let i=0;i<12&&!s.event&&!s.lost;i++)advanceSeason(s);check('Событие создано игровым движком',s.event?.id==='festival');before=background.currentTime;open(s.event.title,s.event.text);await wait(750);check('Окно игрового события не прерывает фон',dialog.open&&!background.paused&&background.currentTime>before+.3&&background.dataset.plays===plays);check('Решение события обработано движком',resolveEvent(s,'skip').ok&&!s.event);dialog.close();
 paused=true;before=background.currentTime;await wait(750);check('Ручная пауза времени не прерывает фон',!background.paused&&background.currentTime>before+.3&&background.dataset.plays===plays);
 s.simTime=0;const b={type:'musicHouse',x:5,y:5,level:1};s.buildings.push(b);const c=s.citizens.find(c=>c.age>=16);Object.assign(c,{role:'production',calling:'musician',work:'5,5',workplace:'5,5',phase:'working',x:5.5,y:5.5,cargo:{},buildCargo:{},waterTrip:null,pantryTrip:null,clinic:null,school:null,site:null,craftSite:null,seedField:null,clothingLoad:null});s.funeral=null;
 await wait(250);check('Обычный 3D вид не загружает литофон',!audio.status.lithophone&&!tracks.some(el=>el.src.includes('lithophone')));
 renderer.camera.radius=18;await wait(1500);const litho=tracks.find(el=>el.src.includes('lithophone'));check('Рядом и крупно литофон играет',litho&&!litho.paused&&litho.currentTime>0&&litho.volume>0);before=litho?.currentTime;open('Здание музыканта','Пауза и карточка здания не обрывают уже играющий литофон.');await wait(750);check('Окно и пауза сохраняют игру литофона',dialog.open&&litho&&!litho.paused&&litho.currentTime>before+.3);dialog.close();
 renderer.camera.target.x=39;await wait(150);check('В полутора клетках двор уже не слышен',!audio.status.lithophone&&litho.paused);renderer.camera.target.x=30;renderer.camera.radius=60;await wait(150);check('Отдаление камеры глушит только литофон',!audio.status.lithophone&&litho.paused&&!background.paused);
 renderer={ctx:{},w:800,h:600,ox:400,oy:0,tw:120,th:60,zoom:3.5};await wait(600);check('Крупный 2D вид возле двора включает литофон',audio.status.lithophone&&!litho.paused);renderer.ox=160;await wait(150);check('2D панорамирование уводит слушателя от двора',!audio.status.lithophone&&litho.paused);renderer.ox=400;renderer.zoom=1.75;await wait(150);check('Обычный масштаб 2D не включает литофон',!audio.status.lithophone);check('Восемь MP3 не запросились все разом',tracks.length===2,tracks.map(el=>el.src.split('/').at(-1)));
 await audio.toggle();check('Явное выключение останавливает все записи',tracks.every(el=>el.paused));check('Нет ошибок декодирования',tracks.every(el=>!el.error));document.querySelector('#message').textContent=checks.every(c=>c.pass)?`PASS — ${checks.length}/${checks.length}`:'FAIL — см. проверки';
 }catch(error){check('Ошибка сценария',false,String(error));document.querySelector('#message').textContent=String(error);}finally{running=false;event.target.disabled=false;}};
document.querySelector('#mute').onclick=async()=>{if(audio.enabled)await audio.toggle();};
function frame(){audio.tick(s,paused,cityAudioListener(renderer));document.querySelector('#checks').textContent=JSON.stringify(checks,null,2);document.querySelector('#metrics').textContent=JSON.stringify({...audio.status,paused,dialog:dialog.open,event:s.event?.id||null,listener:cityAudioListener(renderer),tracks:tracks.map(el=>({file:el.src.split('/').at(-1),paused:el.paused,ready:el.readyState,time:+el.currentTime.toFixed(2),volume:+el.volume.toFixed(3),plays:Number(el.dataset.plays),error:el.error?.code||null})),requests:performance.getEntriesByType('resource').filter(r=>r.name.includes('/assets/audio/')).length},null,2);requestAnimationFrame(frame);}frame();window.addEventListener('pagehide',()=>audio.dispose());
</script></html>
