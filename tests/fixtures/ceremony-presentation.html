 const torchBearers=state.citizens.filter(c=>festivalCitizenView(state,c).festivalTorch).length;
 status.textContent=`${phase} · гостей ${feast?.dancing.length||0} · носилок ${funeral?.biers.length||0} · светильников ${houseLights.festivalLampCount} / зданий ${houseLights.festivalBuildingCount} · факелоносцев ${torchBearers} · прошло ${(feast?.elapsed??state.funeral?.timer??0).toFixed(1)} с · календарь ${clockFixed?'стоит':'идёт'} · ${Number.isFinite(engine.getFps())?Math.round(engine.getFps()):'—'} FPS`;
 status.dataset.phase=phase;status.dataset.clockFrozen=String(clockFixed);status.dataset.lampCount=String(houseLights.festivalLampCount);status.dataset.litBuildings=String(houseLights.festivalBuildingCount);status.dataset.torchBearers=String(torchBearers);
