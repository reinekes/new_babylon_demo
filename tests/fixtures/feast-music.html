import {createCityAudio} from '../../city-audio.js?v=beer-feast-encyclopedia-20261027-1';
const s={simTime:0,citizens:[],buildings:[]},elements=[],checks=[],seen=new Set();let paused=false,running=false;
const audio=createCityAudio(text=>document.querySelector('#message').textContent=text,{createMedia(){const element=new Audio();elements.push(element);element.addEventListener('playing',()=>seen.add(element.src.split('/').at(-1)));return element;}});
const feast=(occasion)=>({occasion,stage:'celebrating',consumed:true,actors:[{id:1,kind:'guest',stage:'dancing'}]});
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(name,pass,detail)=>checks.push({name,pass:!!pass,...(detail===undefined?{}:{detail})});
async function audible(theme){await wait(1700);const element=elements.find(el=>el.src.includes(theme));return !!element&&!element.paused&&element.readyState>=3&&element.currentTime>0&&!element.error;}
document.querySelector('#run').onclick=async event=>{if(running)return;running=true;event.target.disabled=true;checks.length=0;
 try{
  check('До opt-in нет MP3',performance.getEntriesByType('resource').every(r=>!r.name.includes('/assets/audio/')));
  audio.tick(s,false);await audio.toggle();
  s.festival={...feast('firstBeer'),stage:'supplying',consumed:false,actors:[]};await wait(400);check('Доставка не включает праздничный трек',audio.status.theme==='main'&&!elements.some(el=>el.src.includes('feast')));
  s.festival={...feast('firstBeer'),stage:'waiting',consumed:false,actors:[]};await wait(300);check('Сбор гостей не включает праздничный трек',audio.status.theme==='main');
  s.festival=feast('firstBeer');check('Настоящий MP3 первой кружки играет',await audible('first-beer-feast'));
  const first=elements.find(el=>el.src.includes('first-beer-feast'));paused=true;await wait(200);check('Пауза времени не прерывает первую кружку',first&&!first.paused);paused=false;await wait(250);check('Текущий пир возобновляется',audio.status.theme==='firstBeer'&&!first.paused);
  s.festival=feast('nightLights');check('Настоящий MP3 Ночи огней играет',await audible('night-lights-feast'));check('Первая кружка затихла',first.paused);
  s.funeral={stage:'procession',deceased:[{id:9}]};await wait(1700);check('Похороны выше праздника',audio.status.theme==='funeral1');
  delete s.funeral;delete s.festival.occasion;await wait(1700);check('Старый праздник без occasion получает Ночь огней',audio.status.theme==='nightLights');
  paused=true;await wait(150);check('Пауза времени сохраняет текущую запись',elements.some(el=>!el.paused));delete s.festival;paused=false;await wait(1700);check('Закончившийся пир не переигрывается',audio.status.theme==='main'&&elements.filter(el=>!el.paused).every(el=>el.src.includes('main-theme')));
  await audio.toggle();check('Выключение звука останавливает все записи',elements.every(el=>el.paused));check('Оба файла декодированы',seen.has('first-beer-feast.mp3')&&seen.has('night-lights-feast.mp3'));check('Нет ошибок декодирования',elements.every(el=>!el.error));
  document.querySelector('#message').textContent=checks.every(c=>c.pass)?'PASS — оба MP3 и переходы подтверждены':'FAIL — см. проверки';
 }catch(error){check('Ошибка сценария',false,String(error));document.querySelector('#message').textContent=String(error);}finally{running=false;event.target.disabled=false;}
};
document.querySelector('#mute').onclick=async()=>{if(audio.enabled)await audio.toggle();};
function frame(){audio.tick(s,paused);document.querySelector('#metrics').textContent=JSON.stringify({...audio.status,phase:s.festival?.stage,occasion:s.festival?.occasion,paused,seen:[...seen],tracks:elements.map(el=>({file:el.src.split('/').at(-1),paused:el.paused,ready:el.readyState,time:+el.currentTime.toFixed(2),duration:Number.isFinite(el.duration)?+el.duration.toFixed(2):null,volume:+el.volume.toFixed(3),error:el.error?.code||null})),audioRequests:performance.getEntriesByType('resource').filter(r=>r.name.includes('/assets/audio/')).length},null,2);document.querySelector('#checks').textContent=JSON.stringify(checks,null,2);requestAnimationFrame(frame);}frame();window.addEventListener('pagehide',()=>audio.dispose());
</script></html>
