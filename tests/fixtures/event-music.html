const state={simTime:0,buildings:[],citizens:[]},elements=[],events=[];let paused=false,listener={x:5,y:5},dead=0;

const audio=createCityAudio(t=>message.textContent=t,{createMedia(){const el=new Audio();elements.push(el);for(const event of ['play','playing','pause','loadedmetadata','error'])el.addEventListener(event,()=>log(event,el));return el;}});
document.querySelector('#sound').onclick=async e=>{const enabled=await audio.toggle();e.target.textContent=enabled?'Выключить звук':'Включить звук';message.textContent=enabled?'Воспроизведение разрешено пользователем':'Звук выключен';};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Продолжить':'Пауза';};
document.querySelector('#small').onclick=()=>{state.citizens=[];state.buildings=[];state.simTime=0;};document.querySelector('#grown').onclick=()=>{state.citizens=Array.from({length:24},(_,id)=>({id}));state.buildings=[];state.simTime=0;};document.querySelector('#night').onclick=()=>state.simTime=35;document.querySelector('#funeral').onclick=()=>state.funeral={stage:'procession',deceased:[{id:++dead}]};document.querySelector('#finish').onclick=()=>state.funeral=null;
document.querySelector('#lithophone').onclick=()=>{state.funeral=null;state.simTime=0;listener={x:5,y:5};state.buildings=[{type:'musicHouse',x:5,y:5,level:1}];state.citizens=[{id:1,age:30,role:'production',calling:'musician',work:'5,5',workplace:'5,5',phase:'working',x:5.5,y:5.5,cargo:{}}];};document.querySelector('#away').onclick=()=>listener={x:35,y:35};document.querySelector('#uninspire').onclick=()=>{if(state.citizens[0])state.citizens[0].calling='auto';};
function frame(){audio.tick(state,paused,listener);const metrics={...audio.status,paused,hidden:document.hidden,tracks:elements.map(el=>({file:el.src.split('/').at(-1),paused:el.paused,ready:el.readyState,time:+el.currentTime.toFixed(2),duration:Number.isFinite(el.duration)?+el.duration.toFixed(2):null,volume:+el.volume.toFixed(3),error:el.error?.code||null})),audioRequests:performance.getEntriesByType('resource').filter(r=>r.name.includes('/assets/audio/')).length};document.querySelector('#metrics').textContent=JSON.stringify(metrics,null,2);document.querySelector('#log').textContent=JSON.stringify(events,null,2);requestAnimationFrame(frame);}frame();window.addEventListener('pagehide',()=>audio.dispose());
